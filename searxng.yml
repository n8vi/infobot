use_default_settings:
  engines:
    keep_only: [brave, duckduckgo, google]

search:
  formats: [json]
  autocomplete: ''

server:
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 3.0
  max_request_timeout: 4.0

plugins: {}

engines:
  - name: brave
    disabled: false
  - name: google
    disabled: false
